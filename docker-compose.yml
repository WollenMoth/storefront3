services:
  web:
    build: .
    command: ./wait-for-it.sh db:3306 -- ./docker-entrypoint.sh
    ports:
      - "80:80"
    depends_on:
      - redis
      - db
    restart: on-failure
    volumes:
      - .:/app
  db:
    image: postgres:latest
    ports:
      - "5433:5432"
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=abcd1234
      - POSTGRES_DB=storefront3
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redisdata:/data
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5000:80"
      - "25:25"
    restart: always
  celery:
    build: .
    command: celery -A storefront worker --loglevel=info
    depends_on:
      - redis
    volumes:
      - .:/app
  celery-beat:
    build: .
    command: celery -A storefront beat --loglevel=info
    depends_on:
      - redis
    volumes:
      - .:/app
  tests:
    build: .
    command: ./wait-for-it.sh db:3306 -- ptw
    depends_on:
      - redis
      - db
    tty: true
    volumes:
      - .:/app
  flower:
    build: .
    command: celery -A storefront flower
    depends_on:
      - web
      - redis
      - celery
    environment:
      - DEBUG=1
      - CELERY_BROKER=redis://redis:6379/0
      - CELERY_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    restart: on-failure
volumes:
  pgdata:
  redisdata:
