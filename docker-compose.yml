x-app: &app
  build:
    context: .
    target: development
  env_file: .env
  environment: &app-environment
    DJANGO_SETTINGS_MODULE: storefront.settings.dev
    DATABASE_URL: postgres://${POSTGRES_USER:-storefront}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-storefront3}
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    EMAIL_URL: smtp://smtp4dev:25
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ./docker-entrypoint.sh python manage.py runserver 0.0.0.0:8000
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    restart: on-failure
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storefront}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-storefront3}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redisdata:/data
  smtp4dev:
    image: rnwood/smtp4dev:v3
    profiles: [mail]
    ports:
      - "5000:80"
      - "2525:25"
  celery:
    <<: *app
    command: celery -A storefront worker --loglevel=info
  celery-beat:
    <<: *app
    command: celery -A storefront beat --loglevel=info
  tests:
    <<: *app
    profiles: [test]
    command: python scripts/check.py
    environment:
      <<: *app-environment
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-storefront}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-storefront3}
  flower:
    <<: *app
    profiles: [monitoring]
    command: celery -A storefront flower
    ports:
      - "127.0.0.1:5555:5555"

volumes:
  pgdata:
  redisdata:
