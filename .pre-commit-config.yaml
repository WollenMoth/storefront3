default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.18.1
    hooks:
      - id: markdownlint_docker
        args: [--rules, "~MD013"]

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.47.0
    hooks:
      - id: djlint-django

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
      - id: uv-export
        args: [--frozen, --no-dev, --output-file=requirements.txt, --quiet]

  - repo: local
    hooks:
      - id: project-checks
        name: Django, migrations, pytest, dependency integrity and security
        entry: uv run --locked python scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
