name: Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --locked pre-commit run --all-files
      - run: git diff --exit-code

  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
        database: [sqlite, postgres]
        include:
          - python: "3.14"
            experimental: false
          - python: "3.15"
            experimental: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: storefront
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: storefront3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storefront -d storefront3"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      UV_PYTHON: ${{ matrix.python }}
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://storefront:ci-only-password@localhost:5432/storefront3' || 'sqlite:///:memory:' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python scripts/check.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --target production -t storefront3:ci .
      - run: >-
          docker run --rm --entrypoint python
          -e DJANGO_SETTINGS_MODULE=storefront.settings.test
          storefront3:ci manage.py check
